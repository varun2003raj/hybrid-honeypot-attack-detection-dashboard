 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOC Security Access Portal</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at center, #0b1220, #000);
        color: #e6f1ff;
        display: flex;
        align-items: center;
        justify-content: center;
    }


    /* Login box */
    .login-box {
        width: 360px;
        padding: 35px;
        background: rgba(10, 20, 35, 0.8);
        border: 1px solid #1f3b5a;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(0, 180, 255, 0.2);
        text-align: center;
    }

    .title {
        font-size: 20px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .subtitle {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        background: #0a0f1a;
        border: 1px solid #1f3b5a;
        color: #fff;
        outline: none;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: linear-gradient(90deg, #00bfff, #0066ff);
        border: none;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
    }

    button:hover {
        opacity: 0.9;
    }

    .footer-note {
        font-size: 11px;
        margin-top: 15px;
        opacity: 0.6;
    }

    .security-note {
        font-size: 11px;
        opacity: 0.6;
        margin-bottom: 15px;
    }

</style>
</head>

<body>


<!-- LOGIN BOX -->
<div class="login-box">
    <div class="title">SECURITY OPERATIONS CENTER</div>
    <div class="subtitle">SECURE ACCESS PORTAL</div>
    <div class="security-note">
        Secure access is monitored and logged
    </div>
    {% if error %}
    <p style="color:#ff4d4d; font-size:13px; margin-bottom:10px;">
        {{ error }}
    </p>
    {% endif %}    

    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username / Email">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>

    <div class="footer-note">
        Unauthorized access is strictly monitored and logged
    </div>
</div>

</body>
</html>
